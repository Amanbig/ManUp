name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  push_to_registries:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # arm64 emulation is only needed for the full multi-arch build we do
      # on version tags — skip it on plain main pushes to keep those fast.
      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only stamp `latest` when this build is a version tag (never on a
      # plain `main` push) AND it is the highest semver tag in the repo.
      # This stops `latest` from drifting back if an older release tag
      # ever gets rebuilt after a newer version has already shipped.
      - name: Determine if this tag is the newest release
        id: latest_check
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          HIGHEST_TAG="$(git tag -l 'v*' | sort -V | tail -n1)"
          if [ "$CURRENT_TAG" = "$HIGHEST_TAG" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/manup', secrets.DOCKERHUB_USERNAME) || '' }}
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.latest_check.outputs.is_latest == 'true' }}

      # Full multi-arch only for actual releases (version tags). Plain
      # main pushes build amd64 only, for fast dev-tag iteration.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Draft only — pre-filled with the pull commands so you just hit
      # "Generate release notes" in the GitHub UI, edit, and publish.
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi

          cat > /tmp/release-notes.md <<EOF
          ## Docker images

          \`\`\`bash
          docker pull procoder588/manup:$VERSION
          # or
          docker pull ghcr.io/amanbig/manup:$VERSION
          \`\`\`

          ---
          _Click **Generate release notes** above to pull in the changelog, edit as needed, then publish._
          EOF

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "ManUp $TAG" \
            --notes-file /tmp/release-notes.md
